<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Предпросмотр API и метрик SheetBridge Sync</title><desc id="desc">Тёмная панель с состояниями очереди и примером API-ответа</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient></defs>
<rect width="1200" height="720" rx="24" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="664" rx="16" fill="#0b1220" stroke="#253452"/>
<circle cx="60" cy="60" r="7" fill="#fb7185"/><circle cx="84" cy="60" r="7" fill="#fbbf24"/><circle cx="108" cy="60" r="7" fill="#34d399"/><text x="150" y="67" fill="#94a3b8" font-family="Arial" font-size="18">SheetBridge Sync  /  Operations</text>
<text x="70" y="130" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="700">Queue overview</text>
<g font-family="Arial"><rect x="70" y="165" width="250" height="115" rx="14" fill="#111c2e"/><text x="94" y="200" fill="#94a3b8" font-size="17">DONE</text><text x="94" y="252" fill="#36d399" font-size="42" font-weight="700">1,248</text><rect x="345" y="165" width="250" height="115" rx="14" fill="#111c2e"/><text x="369" y="200" fill="#94a3b8" font-size="17">PROCESSING</text><text x="369" y="252" fill="#38bdf8" font-size="42" font-weight="700">7</text><rect x="620" y="165" width="250" height="115" rx="14" fill="#111c2e"/><text x="644" y="200" fill="#94a3b8" font-size="17">DLQ</text><text x="644" y="252" fill="#fb7185" font-size="42" font-weight="700">3</text></g>
<rect x="70" y="320" width="800" height="300" rx="14" fill="#101a2b" stroke="#253452"/><text x="96" y="357" fill="#8be9c5" font-family="monospace" font-size="17">POST /sync  →  202 Accepted</text><text x="96" y="395" fill="#64748b" font-family="monospace" font-size="16">{</text><text x="118" y="430" fill="#c4b5fd" font-family="monospace" font-size="16">"job_id"</text><text x="250" y="430" fill="#cbd5e1" font-family="monospace" font-size="16">: "8c3a...",</text><text x="118" y="465" fill="#c4b5fd" font-family="monospace" font-size="16">"status"</text><text x="250" y="465" fill="#8be9c5" font-family="monospace" font-size="16">: "pending",</text><text x="118" y="500" fill="#c4b5fd" font-family="monospace" font-size="16">"created"</text><text x="250" y="500" fill="#fbbf24" font-family="monospace" font-size="16">: true</text><text x="96" y="540" fill="#64748b" font-family="monospace" font-size="16">}</text><text x="915" y="375" fill="#94a3b8" font-family="Arial" font-size="16">At-least-once</text><text x="915" y="410" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">Delivery</text><text x="915" y="470" fill="#94a3b8" font-family="Arial" font-size="16">PostgreSQL</text><text x="915" y="500" fill="#f8fafc" font-family="Arial" font-size="20">Durable queue</text><text x="915" y="560" fill="#94a3b8" font-family="Arial" font-size="16">Worker replicas</text><text x="915" y="590" fill="#f8fafc" font-family="Arial" font-size="20">SKIP LOCKED</text>
</svg>
