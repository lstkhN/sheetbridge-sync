<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Поток синхронизации SheetBridge Sync</title><desc id="desc">Визуальный preview потока от Google Sheets через очередь к Bitrix24</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#12304a"/></linearGradient><linearGradient id="a"><stop stop-color="#36d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="1200" height="520" rx="24" fill="url(#b)"/><text x="70" y="78" fill="#f8fafc" font-family="Arial" font-size="31" font-weight="700">Reliable sync pipeline</text><text x="70" y="113" fill="#94a3b8" font-family="Arial" font-size="18">From spreadsheet change to CRM contact — with retries and DLQ</text><g font-family="Arial"><rect x="70" y="200" width="220" height="150" rx="18" fill="#10243a" stroke="#38bdf8" stroke-width="2"/><text x="110" y="255" fill="#38bdf8" font-size="20" font-weight="700">GOOGLE SHEETS</text><text x="110" y="295" fill="#cbd5e1" font-size="17">Name + email</text><rect x="490" y="170" width="220" height="210" rx="18" fill="#102f32" stroke="#36d399" stroke-width="2"/><text x="530" y="235" fill="#36d399" font-size="20" font-weight="700">POSTGRES</text><text x="530" y="273" fill="#cbd5e1" font-size="17">Durable queue</text><text x="530" y="310" fill="#cbd5e1" font-size="17">Idempotency</text><text x="530" y="347" fill="#cbd5e1" font-size="17">Leases + retries</text><rect x="910" y="200" width="220" height="150" rx="18" fill="#241c3d" stroke="#c4b5fd" stroke-width="2"/><text x="950" y="255" fill="#c4b5fd" font-size="20" font-weight="700">BITRIX24</text><text x="950" y="295" fill="#cbd5e1" font-size="17">Upsert contact</text></g><path d="M310 275h155m260 0h155" stroke="url(#a)" stroke-width="8" stroke-linecap="round"/><path d="m445 250 28 25-28 25m420-50 28 25-28 25" fill="none" stroke="#8be9c5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="450" fill="#8be9c5" font-family="monospace" font-size="18">retry → backoff → replay DLQ</text></svg>
